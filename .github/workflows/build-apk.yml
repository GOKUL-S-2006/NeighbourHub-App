name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Setup Java JDK
      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies cleanly
      - name: 📦 Install Dependencies
        run: |
          npm cache clean --force
          npm ci --prefer-online

      # 5. Verify critical dependencies
      - name: 🔍 Verify JavaScript Dependencies
        run: |
          echo "Checking whatwg-fetch package..."

          node -p "require('./node_modules/whatwg-fetch/package.json').main"

          test -f node_modules/whatwg-fetch/dist/fetch.umd.js
          echo "whatwg-fetch file exists!"

          echo "Checking axios package..."

          node -p "require('./node_modules/axios/package.json').version"

          test -f node_modules/axios/dist/esm/axios.js
          echo "axios file exists!"

      # 6. Generate Android project files
      - name: ⚙️ Generate Android Project Files
        run: npx expo prebuild --platform android --no-install

      # 7. Configure Android SDK
      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 8. Build release APK
      - name: 🛠️ Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 9. Upload APK artifact
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighbourHub-App-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
