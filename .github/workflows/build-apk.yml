name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      # 3. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm ci --prefer-online

      # 5. Verify dependencies before prebuild
      - name: Verify Dependencies
        run: |
          echo "===== Node version ====="
          node --version

          echo "===== npm version ====="
          npm --version

          echo "===== whatwg-fetch dependency tree ====="
          npm ls whatwg-fetch

          echo "===== Check package entry file ====="
          node -e "console.log(require.resolve('whatwg-fetch'))"

          echo "===== Check required file ====="
          test -f node_modules/whatwg-fetch/dist/fetch.umd.js
          echo "SUCCESS: fetch.umd.js exists"

      # 6. Generate Android project
      - name: Generate Android Project Files
        run: npx expo prebuild --platform android --no-install

      # 7. Verify dependencies after prebuild
      - name: Verify Dependencies After Prebuild
        run: |
          echo "===== Check whatwg-fetch directory ====="
          ls -la node_modules/whatwg-fetch/
          ls -la node_modules/whatwg-fetch/dist/

          echo "===== Check required file ====="
          test -f node_modules/whatwg-fetch/dist/fetch.umd.js
          echo "SUCCESS: fetch.umd.js still exists"

          echo "===== Check Node resolution ====="
          node -e "console.log(require.resolve('whatwg-fetch'))"

      # 8. Accept Android SDK licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 9. Build release APK
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 10. Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighbourHub-App-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
