name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      # 3. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm ci --prefer-online

      # 5. Diagnose whatwg-fetch
      - name: Verify Dependencies
        run: |
          echo "===== Node version ====="
          node --version

          echo "===== npm version ====="
          npm --version

          echo "===== whatwg-fetch dependency tree ====="
          npm ls whatwg-fetch || true

          echo "===== whatwg-fetch package.json ====="
          cat node_modules/whatwg-fetch/package.json

          echo "===== whatwg-fetch directory ====="
          ls -la node_modules/whatwg-fetch/
          ls -la node_modules/whatwg-fetch/dist/ || true

          echo "===== Verify required file ====="
          if test -f node_modules/whatwg-fetch/dist/fetch.umd.js; then
            echo "SUCCESS: fetch.umd.js exists"
          else
            echo "ERROR: fetch.umd.js is missing"
            exit 1
          fi

      # 6. Generate Android project
      - name: Generate Android Project Files
        run: npx expo prebuild --platform android --no-install

      # 7. Build APK
      - name: Build Release APK
        run: |
          echo "y" | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 8. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighbourHub-App-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
